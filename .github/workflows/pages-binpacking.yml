# Publishes Greedy_BinPacking_HTML/ (and nothing else from this repo) to
# GitHub Pages. One-time setup: repo Settings → Pages → Build and deployment
# → Source: "GitHub Actions".
name: Deploy bin packing (HTML) to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "Greedy_BinPacking_HTML/**"
      - ".github/workflows/pages-binpacking.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: Greedy_BinPacking_HTML
      # Pages lets browsers cache files for 10 minutes. Stamping the commit
      # into every asset URL makes a freshly loaded page always fetch the
      # scripts and styles from the same deploy as itself.
      - name: Version asset URLs
        run: sed -i "s/?v=dev/?v=${GITHUB_SHA::8}/g" Greedy_BinPacking_HTML/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: Greedy_BinPacking_HTML
      - id: deployment
        uses: actions/deploy-pages@v4
